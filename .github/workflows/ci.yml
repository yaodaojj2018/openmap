name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: 后端 lint / typecheck / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装依赖
        run: pip install -e ".[dev]"
      - name: 格式检查
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: 类型检查
        run: mypy
      - name: BF 归档 ↔ 回归测试一致性检查
        run: python ../scripts/check_bugfix_regression.py
      - name: 冒烟测试（主链路先行，红了不等全量）
        run: pytest -m smoke -q
      - name: 全量测试 + 域层覆盖率门禁（docs/regression-ci.md §3）
        run: >-
          pytest -q --cov=app.isochrone --cov=app.poi --cov=app.coverage --cov=app.blindspot
          --cov-fail-under=95 --cov-report=term --junitxml=pytest.xml
      - name: 测试与覆盖率写入 Job Summary
        if: always()
        run: |
          {
            echo "## 后端测试与覆盖率报告"
            echo '```'
            python -m coverage report || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 上传测试报告（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: backend/pytest.xml

  frontend:
    name: 前端 lint / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: 前端回归测试（vitest，BF 归档 ↔ 回归测试）
        run: npm test
      - name: 构建（含 tsc --strict）
        run: npm run build

  docker:
    name: Compose 配置与镜像构建（main 分支）
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: 校验 compose 配置
        run: docker compose config -q
      - name: 构建镜像
        run: docker compose build
