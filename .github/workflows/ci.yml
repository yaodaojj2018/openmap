name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: 后端 lint / typecheck / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装依赖
        run: pip install -e ".[dev]"
      - name: 格式检查
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: 类型检查
        run: mypy
      - name: 测试（含回放快照断言）
        run: pytest -q

  frontend:
    name: 前端 lint / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: 构建（含 tsc --strict）
        run: npm run build

  docker:
    name: Compose 配置与镜像构建（main 分支）
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: 校验 compose 配置
        run: docker compose config -q
      - name: 构建镜像
        run: docker compose build
